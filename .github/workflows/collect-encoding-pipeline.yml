name: Collect encoding pipeline

# Rebuilds encodings.pipeline_attempts: every targeted re-encode dispatch
# followed through its PR, merge, the rulespec_files index, and the
# axiom-api compile sweep. The /ops pipeline view reads only that table.
# After writing, it dispatches sync-rulespec-index.yml when a merge is
# waiting for the index, so merges don't wait out the 6-hour sync cron.
# A second step measures every program bundle (encodings.program_bundle_*)
# every six hours.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      failure_lookups:
        description: Failed runs to look up this pass (about 2.5 GitHub requests each; the token allows 1,000/hour)
        default: "60"
      run_detail_lookups:
        description: Finished runs whose jobs to read this pass (one GitHub request each)
        default: "80"
      check_error_lookups:
        description: Failing PR checks whose log to read this pass (one GitHub request each)
        default: "60"
      merge_test_lookups:
        description: Merges whose merge commit's checks to read this pass (one GitHub request each)
        default: "40"

permissions:
  contents: read
  # Dispatch sync-rulespec-index.yml after merges.
  actions: write

concurrency:
  group: collect-encoding-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: >-
          bun scripts/collect-encoding-pipeline.mjs
          --failure-lookups "${{ inputs.failure_lookups || '60' }}"
          --run-detail-lookups "${{ inputs.run_detail_lookups || '80' }}"
          --check-error-lookups "${{ inputs.check_error_lookups || '60' }}"
          --merge-test-lookups "${{ inputs.merge_test_lookups || '40' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actions:read on the private axiom-api repo, for the nightly
          # compile sweep's artifact. Optional: unset leaves the compile
          # stage unchecked.
          AXIOM_API_ARTIFACTS_TOKEN: ${{ secrets.AXIOM_API_ARTIFACTS_TOKEN }}
      # Program bundles (axiom-corpus manifests/program-bundles: 13 programs,
      # federal and every state, about 37,000 documents) measured against the
      # corpus, every module's rules and the attempts just written. Every six
      # hours (and on a manual run): a pass reads a quarter of a million corpus
      # nodes and rewrites every row.
      - id: bundle-due
        run: |
          hour=$(date -u +%H); minute=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ $((10#$hour % 6)) -eq 0 ] && [ $((10#$minute)) -lt 30 ]; }; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.bundle-due.outputs.due == 'true'
        run: bun scripts/collect-program-bundles.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
