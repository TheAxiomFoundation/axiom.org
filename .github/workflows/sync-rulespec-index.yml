name: Sync RuleSpec search index

# Keeps encodings.rulespec_files (the encoded-search index) in step
# with the rulespec-* repos so the app answers encoded searches from
# one database query instead of crawling GitHub at request time.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # One sync at a time: scheduled, manual and collector-dispatched runs
    # would otherwise interleave their per-module resets and stale-row
    # cleanups. A run that arrives while one is going waits; GitHub keeps
    # only the newest waiting run, which reads the repos afresh anyway.
    concurrency:
      group: sync-rulespec-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-rulespec-index.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fail loudly when a public rulespec repo and the app's repo map /
  # jurisdictions seed disagree — a new country's encodings existing
  # but invisible to the app (the rulespec-nz gap), a stale
  # RULESPEC_REPOS entry, an unregistered root-layout repo.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-rulespec-drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
